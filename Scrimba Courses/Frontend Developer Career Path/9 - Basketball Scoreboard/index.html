<!doctype html>
<html lang="eng">
    <head>
        <title>BasketBall Scoreboard</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <div class="column">
                <h3>HOME</h3>
                <h2 class="score" id="score-el">0</h2>
            </div>
            <div class="btn-home">
                <button id="home-btn-1" onclick="plusOne()">+1</button>
                <button id="home-btn-2" onclick="plusTwo()">+2</button>
                <button id="home-btn-3" onclick="plusThree()">+3</button>
            </div>
            <div class="container">
                <div class="column">
                    <h3>GUEST</h3>
                    <h2 class="score" id="score-ell">0</h2>
                </div>
                <div class="btn-container">
                    <button onclick="plusOneG">+1</button>
                    <button onclick="plusTwoG">+2</button>
                    <button onclick="plusThreeG">+3</button>
                </div>
            </div>
        </div>
    </body>
</html>
