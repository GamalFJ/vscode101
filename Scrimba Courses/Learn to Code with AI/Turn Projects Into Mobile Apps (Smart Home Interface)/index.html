<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <title>Home Pal</title>
</head>
<body>
    <header>
        <header>
        
        <h1>Home Pal</h1>
        <h6>Powered By</h6>
        <img src="./images/Purple_Cove_Labs_Transparent.png" alt="HomeHarmony Logo" style="height: 60px;">
    </header>
    <main>
        <section id="lighting">
            <h2><i class="fas fa-lightbulb"></i> Lighting</h2>
            <label class="switch">
                <input type="checkbox" id="toggleLights">
                <span class="slider"></span>
            </label>
        </section>
        <section id="temperature">
            <h2><i class="fas fa-thermometer-half"></i> Temperature</h2>
            <!-- Emoji & Animations -->
            <div id="temperatureStatus" class="temperature-status"></div>

            <div class="temperature-display" id="temperatureDisplay">21°c</div>
            <button id="increaseTemp"><i class="fas fa-chevron-up"></i> Increase</button>
            <button id="decreaseTemp"><i class="fas fa-chevron-down"></i> Decrease</button>
        </section>
        <section id="music">
            <h2><i class="fas fa-music"></i> Music</h2>
            <!-- YouTube video container (in your HTML) -->
            <div id="youtubePlayer"></div>
            <div class="song-name" id="songName">Press Play to Get Groovy!</div>
            <button id="playPause"><i class="fas fa-play"></i> Play</button>
            <button id="stop"><i class="fas fa-stop"></i> Stop</button>
            <button id="nextTrack"><i class="fas fa-forward"></i> Next</button>
        </section>
    </main>
    <script src="script.js"></script>
    <footer class="footer">
        &copy; Developed by Gamal Jastram @ Purple Cove Labs
    </footer>
</body>
</html>
