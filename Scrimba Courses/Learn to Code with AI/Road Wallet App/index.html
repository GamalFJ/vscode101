<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#06b6d4" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Road Wallet</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --navy: #0a2540;
      --turquoise: #06b6d4;
      --light: #ffffff;
      --dark: #0e1726;
      --red-orange: #ff6b35;
      --green: #4ade80;
      --bg-gradient: linear-gradient(to right, var(--navy), var(--turquoise));
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-gradient);
      color: var(--light);
      min-height: 100vh;
      padding: 30px 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      background-color: var(--dark);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      padding: 30px;
      width: 100%;
      max-width: 600px;
    }

    h1, h2, h3 {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 28px;
    }

    h1 i {
      font-size: 26px;
      color: var(--turquoise);
      margin-right: 10px;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: 600;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--turquoise);
      background-color: #0f1c2f;
      color: var(--light);
      font-size: 16px;
    }

    button {
      background-color: var(--navy);
      color: var(--light);
      font-size: 16px;
      font-weight: 600;
      border: 2px solid var(--turquoise);
      border-radius: 6px;
      padding: 10px 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
    }

    button:hover {
      background: var(--turquoise);
      color: var(--dark);
      transform: scale(1.03);
      box-shadow: 0 0 12px var(--turquoise);
    }

    hr {
      border: none;
      border-top: 1px solid #1e2b3a;
      margin: 20px 0;
    }

    ul, #travelers-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li, .traveler-item {
      background-color: #13293d;
      padding: 10px 14px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    li button, .traveler-item button {
      width: 36px;
      height: 36px;
      background-color: var(--red-orange);
      border: none;
      color: var(--light);
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.3s ease;
    }

    li button i, .traveler-item button i {
      font-size: 16px;
    }

    li button:hover, .traveler-item button:hover {
      background-color: red;
      color: var(--light);
    }

    #open-modal-button {
      margin: 0 auto 24px;
      display: block;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.7);
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .display-modal {
      display: flex;
    }

    .modal-content {
      background-color: #0f1c2f;
      color: var(--light);
      padding: 24px;
      border-radius: 10px;
      width: 100%;
      max-width: 400px;
      position: relative;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
    }

    .close-button {
      position: absolute;
      top: 8px;
      right: 10px;
      font-size: 20px;
      cursor: pointer;
      color: var(--turquoise);
    }

    .money {
      color: var(--green);
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><i class="ti ti-road"></i> Road Wallet</h1>
    <h2 class="heading-total">Total Expenses: <span id="total-expenses-amount" class="money">$0</span></h2>

    <button id="open-modal-button"><i class="ti ti-users"></i> Manage Travelers</button>

    <div id="travelers-modal" class="modal">
      <div class="modal-content">
        <span class="close-button">&times;</span>
        <form id="travelers-form">
          <h2>Add Traveler</h2>
          <label for="traveler-name">Traveler Name:</label>
          <input type="text" id="traveler-name" required>
          <button type="submit" id="add-traveler"><i class="ti ti-user-plus"></i> Add Traveler</button>
        </form>

        <h3>Travelers</h3>
        <div id="travelers-list"></div>
      </div>
    </div>

    <hr>

    <form id="expense-form">
      <h2>Add Expense</h2>
      <label for="expense-category">Category:</label>
      <select id="expense-category">
        <option value="food">Food</option>
        <option value="gas">Gas</option>
        <option value="accommodations">Accommodations</option>
        <option value="sightseeing">Sightseeing</option>
      </select>
      <label for="expense-amount">Amount:</label>
      <input type="number" id="expense-amount" min="0" required>
      <button type="submit"><i class="ti ti-plus"></i> Add Expense</button>
    </form>

    <hr>

    <h2>Expense History</h2>
    <ul id="expense-list">
      <!-- Example item: -->
      <li>
        <span>Dinner</span>
        <span class="money">$20</span>
        <button class="delete-button" title="Delete"><i class="fas fa-trash-alt"></i></button>
      </li>
    </ul>
  </div>

  <script src="index.js" type="module"></script>
</body>
</html>
