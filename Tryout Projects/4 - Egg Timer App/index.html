<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anahuac Egg Timer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Anahuac Egg Timer</h1>
        <div class="egg-container">
            <img id="egg" src="egg 1.png" alt="Egg" />
        </div>
        <div class="controls">
            <label for="cooking-level">Select Cooking Level:</label>
            <select id="cooking-level">
                <option value="soft">Soft Boiled (4 mins)</option>
                <option value="medium">Medium Boiled (7 mins)</option>
                <option value="hard">Hard Boiled (10 mins)</option>
            </select>
            <button id="start-timer">Start Timer</button>
        </div>
        <div id="timer-display">Time Left: <span id="time-left">0</span> seconds</div>
        <div id="animation" class="animation"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
