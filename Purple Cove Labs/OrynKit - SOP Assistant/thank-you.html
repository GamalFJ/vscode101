  <meta charset="UTF-8" />

  <title>Thank You – OrynKit</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 30% 30%, #1a082d, #0b0b14 60%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    /* Abstract Overlays */
    body::before {
      content: '';
      position: fixed;
      top: -200px;
      left: -200px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(88, 0, 153, 0.4), transparent 70%);
      filter: blur(120px);
      z-index: -1;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -200px;
      right: -200px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(138, 43, 226, 0.3), transparent 70%);
      filter: blur(100px);
      z-index: -1;
    }

    .thank-you-box {
      background: rgba(24, 24, 40, 0.9);
      padding: 3rem;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      animation: fadeIn 1.2s ease;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Checkmark Animation */
    .checkmark {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: inline-block;
      border: 4px solid #a855f7;
      position: relative;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.6);
      margin-bottom: 1rem;
      animation: pulse 2s infinite;
    }

    .checkmark::after {
      content: '';
      position: absolute;
      left: 22px;
      top: 10px;
      width: 20px;
      height: 40px;
      border-right: 4px solid #a855f7;
      border-bottom: 4px solid #a855f7;
      transform: rotate(45deg);
      animation: draw 1s ease forwards;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 20px rgba(168, 85, 247, 0.6); }
      50% { box-shadow: 0 0 30px rgba(168, 85, 247, 1); }
    }

    @keyframes draw {
      0% { height: 0; width: 0; opacity: 0; }
      50% { height: 0; width: 20px; opacity: 1; }
      100% { height: 40px; width: 20px; }
    }

   h1 {
  font-size: 2.2rem;
  background: linear-gradient(90deg, #a855f7, #6a0dad);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  margin-bottom: 1rem;
}


    p {
      font-size: 1.1rem;
      color: #ccc;
      margin-bottom: 2rem;
    }

    .cta-btn {
      background: #a855f7;
      border: none;
      padding: 1rem 2.5rem;
      font-size: 1rem;
      border-radius: 50px;
      cursor: pointer;
      color: #fff;
      font-weight: 600;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.6);
      text-decoration: none;
      display: inline-block;
    }

    .cta-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.9);
    }
  </style>
</head>
<body>
  <div class="thank-you-box">
    <div class="checkmark"></div>
    <h1>Thank You!</h1>
    <p>Your request has been received.<br>
    The SOP will be generated and sent to your email shortly.</p>
    <a href="index.html" class="cta-btn">Go Back to Home</a>
  </div>
</body>
