<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0b14">
  <meta name="msapplication-TileColor" content="#0b0b14">
  <title>Thank You – OrynKit</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" />
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1a082d, #0b0b14);
      color: #fff;
      text-align: center;
      padding: 4rem 1.5rem;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: rgba(24,24,40,0.9);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: #a855f7;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.2rem;
      color: #ccc;
      margin-bottom: 2rem;
    }

    .cta-btn {
      background: #6a0dad;
      border: none;
      padding: 1rem 2rem;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
      font-weight: 600;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.7);
    }

    .cta-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.9);
    }

    .upsell-box {
      text-align: center;
      padding: 2rem;
      background: rgba(24, 24, 40, 0.9);
      border-radius: 12px;
      margin: 3rem auto;
      max-width: 800px;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
    }

    .upsell-box h2 {
      font-size: 2rem;
      color: #a855f7;
      margin-bottom: 1rem;
    }

    .upsell-box p {
      color: #ccc;
      font-size: 1.1rem;
      margin-bottom: 2.5rem;
    }

    .upsell-box button {
      background: #6a0dad;
      border: none;
      padding: 1rem 2rem;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
      font-weight: 600;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.7);
    }

    .upsell-box button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.9);
    }

    footer {
      margin-top: 2rem;
      padding: 1.5rem;
      font-size: 0.9rem;
      background: #0b0b14;
      color: #aaa;
    }

    footer span {
      color: #a855f7;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Thank You!</h1>
    <p>Your SOP will be sent to your email shortly.</p>
    <button class="cta-btn" onclick="window.location.href='index.html'">Return to Home</button>
  </div>

  <div class="upsell-box">
    <h2>Want Unlimited SOPs?</h2>
    <p>Upgrade to <strong>OrynKit – SOP Pro</strong> for just <strong>$59 lifetime</strong>.</p>
    <a href='https://purplecovelabs.gumroad.com/l/mwcbq' target="_blank" class="cta-btn">Upgrade Now (Pre-Order)</a>
  </div>
<!-- gumroad.com/l/mwcbq -->
  <footer>
    &copy; 2025 Purple Cove Labs – Powered by <span>OrynAI</span>
  </footer>
</body>
</html>
